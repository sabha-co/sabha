# This file configures Herb for your project and team.
# Settings here take precedence over individual editor preferences.
#
# Herb is a suite of tools for HTML+ERB templates including:
# - Linter: Validates templates and enforces best practices
# - Formatter: Auto-formats templates with intelligent indentation
# - Language Server: Provides IDE support (VS Code, Zed, Neovim, etc.)
#
# Website: https://herb-tools.dev
# Configuration: https://herb-tools.dev/configuration
# GitHub Repo: https://github.com/marcoroth/herb
#

version: 0.10.3

# Rails app — enables the actionview-* rules (e.g. silent-helper detection).
framework: actionview

# files:
#   # Additional patterns beyond the defaults (**.html, **.rhtml, **.html.erb, etc.)
#   include:
#     - '**/*.xml.erb'
#     - 'custom/**/*.html'
#
#   # Patterns to exclude (can exclude defaults too)
#   exclude:
#     - 'public/**/*'
#     - 'tmp/**/*'

# engine:
#   validators:
#     security: true       # default: true
#     nesting: true        # default: true
#     accessibility: true  # default: true

linter:
  enabled: true

  # Errors gate CI; warnings and hints stay advisory until the tree is clean.
  failLevel: error

  rules:
    # Instance variables in partials are a deliberate idiom in this codebase,
    # not a mistake — don't rewrite partials to pass locals.
    erb-no-instance-variables-in-partials:
      enabled: false

    # Interpolated/dynamic class names are intentional with Tailwind.
    erb-no-interpolated-class-names:
      enabled: false

    # Conditional/dynamic attributes (`<%= "checked" if x %>`, helper-emitted
    # attribute strings) are a deliberate pattern on hand-written form markup.
    erb-no-output-in-attribute-name:
      enabled: false
    erb-no-output-in-attribute-position:
      enabled: false

    # No CSP-nonce infrastructure; the pre-paint theme script can't carry one.
    html-require-script-nonce:
      enabled: false

    # False positives: `_composer_fields` reads a `label` local (not the form
    # helper); `admin/stats` builds SVG with tag/safe_join inside a lambda whose
    # return value is emitted with `<%= sparkline.call %>`.
    actionview-no-silent-helper:
      exclude:
        - "app/views/rooms/_composer_fields.html.erb"
        - "saas/app/views/admin/stats/show.html.erb"

    # Placeholders that JS fills before the element is shown: the lightbox's
    # image/download/share targets and the autocomplete pill template.
    html-no-empty-attributes:
      exclude:
        - "app/views/layouts/_lightbox.html.erb"
        - "app/views/users/autocompletables/_template.html.erb"

    # Client-side message template: a <script type="text/template"> that JS
    # clones (never executes), interpolating the current user's own data.
    erb-no-unsafe-script-interpolation:
      exclude:
        - "app/views/messages/_template.html.erb"
    html-allowed-script-type:
      exclude:
        - "app/views/messages/_template.html.erb"

formatter:
  enabled: false
  indentWidth: 2
  maxLineLength: 80

  # # Additional patterns beyond the defaults for formatting
  # include:
  #   - '**/*.xml.erb'
  #
  # # Patterns to exclude from formatting
  # exclude:
  #   - 'app/views/admin/**/*'

  # # Rewriters modify templates during formatting
  # rewriter:
  #   # Pre-format rewriters (modify AST before formatting)
  #   pre:
  #     - tailwind-class-sorter
  #   # Post-format rewriters (modify formatted output string)
  #   post: []
