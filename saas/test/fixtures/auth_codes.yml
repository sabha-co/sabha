# frozen_string_literal: true

# AuthCode fixtures for SaaS tests
#
# OTP codes sent via email for passwordless authentication.
# Codes are 6 characters from a limited alphabet (no O, I, L to avoid confusion).

# Active auth code for sign-in
alice_signin:
  global_identity: alice
  code: ABC123
  purpose: sign_in
  expires_at: <%= 15.minutes.from_now.to_fs(:db) %>

# Active auth code for sign-up verification
unverified_signup:
  global_identity: unverified
  code: XYZ789
  purpose: sign_up
  expires_at: <%= 15.minutes.from_now.to_fs(:db) %>

# Expired auth code for testing rejection
expired_code:
  global_identity: bob
  code: EXP456
  purpose: sign_in
  expires_at: <%= 1.minute.ago.to_fs(:db) %>

# Active auth code for email change
email_change:
  global_identity: pending_email
  code: CHG999
  purpose: email_change
  expires_at: <%= 15.minutes.from_now.to_fs(:db) %>
