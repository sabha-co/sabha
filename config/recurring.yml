<% require_relative "../lib/sabha" %>

# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  weekly_digest:
    class: Notification::WeeklyDigestRunnerJob
    queue: default
    schedule: "0 10 * * 2"

<% unless Sabha.saas? %>
  clear_expired_single_sign_on_nonces:
    command: "SingleSignOnNonce.purge_expired"
    schedule: every hour at minute 24
<% end %>

<% if Sabha.saas? %>
  reconcile_storage:
    command: "Workspace.find_each { |w| ApplicationRecord.with_tenant(w.external_id.to_s) { Storage::ReconcileJob.perform_later(Account.sole) } }"
    schedule: every day at 3am

  backup_workspaces:
    command: "Workspace.active.find_each { |w| Workspace::BackupJob.perform_later(w) } if Workspace::R2.configured?"
    schedule: every day at 2am

  snapshot_workspaces:
    command: "Workspace.active.find_each { |w| Workspace::SnapshotJob.perform_later(w) }"
    schedule: every hour
<% end %>
