service: sabha

image: sabha-co/sabha

servers:
  web:
    hosts:
      - <%= ENV.fetch("SERVER_IP") %>
    options:
      # Network alias for anycable-go to reach Rails RPC endpoint
      network-alias: sabha-web

proxy:
  ssl: true
  host: <%= ENV.fetch("PROXY_HOST") %>
  app_port: 3000

registry:
  server: ghcr.io
  username: sabha-co
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    RAILS_ENV: "production"

  secret:
    - APP_VERSION
    - LAST_DEPLOY
    - SECRET_KEY_BASE
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    - RESEND_API_KEY
    - COOKIE_DOMAIN
    - APP_NAME
    - APP_SHORT_NAME
    - APP_DESCRIPTION
    - APP_HOST
    - SUPPORT_EMAIL
    - MAILER_FROM_NAME
    - MAILER_FROM_EMAIL
    - THEME_COLOR
    - BACKGROUND_COLOR
    - UMAMI_WEBSITE_ID
    - UMAMI_HOST
    - CSP_FRAME_ANCESTORS
    - ANYCABLE_SECRET
    - CLOUDFLARE_TURNSTILE_SITE_KEY
    - CLOUDFLARE_TURNSTILE_SECRET_KEY

volumes:
  - "/disk/sabha/:/rails/storage/"

# AnyCable WebSocket server (required)
# Routes /cable path to AnyCable on the same domain
accessories:
  anycable:
    image: anycable/anycable-go:1.6
    host: <%= ENV.fetch("SERVER_IP") %>
    proxy:
      host: <%= ENV.fetch("PROXY_HOST") %>
      app_port: 8080
      path_prefix: /cable
      healthcheck:
        path: /health
    env:
      clear:
        ANYCABLE_HOST: "0.0.0.0"
        ANYCABLE_PORT: "8080"
        ANYCABLE_PATH: "/"
        ANYCABLE_RPC_HOST: "http://sabha-web:3000/_anycable"
        ANYCABLE_BROADCAST_ADAPTER: "http"
        ANYCABLE_HTTP_BROADCAST_PORT: "8080"
        # Presence lives in the broker component; without a broker the presence
        # set silently no-ops. Memory is right for this single-node accessory.
        ANYCABLE_BROKER: "memory"
        ANYCABLE_LOG_LEVEL: "info"
      secret:
        - ANYCABLE_SECRET
        # Optional two-secret split: sign client-facing JWT identity + signed
        # streams with a secret distinct from the RPC/broadcast ANYCABLE_SECRET.
        # Both fall back to ANYCABLE_SECRET when unset, so leaving these out keeps
        # the single-secret setup. To enable, set both here and in the web role,
        # and add them to your secrets file:
        # - ANYCABLE_JWT_SECRET
        # - ANYCABLE_STREAMS_SECRET

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
