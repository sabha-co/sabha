# AnyCable is required (see config/anycable.yml). The in-process ActionCable
# fallback (the redis adapter, previously toggled by an env flag) was removed;
# every app environment uses the any_cable adapter. The test env keeps test.
development:
  adapter: any_cable

test:
  adapter: test

performance:
  adapter: any_cable

production:
  adapter: any_cable
