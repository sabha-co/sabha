default: &default
  # Mount HTTP RPC endpoint in Rails (no separate gRPC process needed)
  http_rpc_mount_path: "/_anycable"

  # Use HTTP for broadcasting to AnyCable-Go
  broadcast_adapter: http
  http_broadcast_url: "http://localhost:8080/_broadcast"

  # Automatic broadcast batching - aggregates all broadcasts within a request/job
  # into a single batched publish to AnyCable-Go (reduces Redis round-trips from O(n) to O(1))
  broadcast_batching: true

  # Connection state caching - faster reconnects after brief disconnects
  restore_from_cache: true
  cache_ttl: 300  # 5 minutes

  # JWT identification: anycable-go decodes the identity in Go and skips the
  # Rails connect RPC, so a reconnect storm no longer saturates the RPC path.
  # The token is minted per-request (already-authenticated) into the cable meta
  # tag, so it also bounds ban/deactivation: a live connection is force-dropped
  # immediately, and a cached token cannot re-establish past this window.
  jwt_ttl: <%= ENV.fetch("ANYCABLE_JWT_TTL", 3600).to_i %>  # 1 hour

# jwt_secret and streams_secret are deliberately unset outside production. The
# gem already resolves each as `ANYCABLE_JWT_SECRET (env) || secret`, and `secret`
# itself picks up ANYCABLE_SECRET from the env — which is the same chain
# anycable-go walks (`${ANYCABLE_JWT_SECRET:-${ANYCABLE_SECRET:-…}}`, see
# Procfile.dev). Spelling the fallback out here in ERB is how they drifted apart:
# it fell back to the literal below rather than to ANYCABLE_SECRET, so a dev with
# ANYCABLE_SECRET set (and no ANYCABLE_JWT_SECRET) had Rails minting tokens
# anycable-go couldn't verify — every socket closed "unauthorized" before any RPC.
development:
  <<: *default
  websocket_url: "ws://localhost:8080/cable"
  secret: "development-secret-change-in-production"

test:
  <<: *default
  secret: "test-secret"

performance:
  <<: *default
  http_broadcast_url: "http://anycable:8080/_broadcast"
  secret: "test-secret"

production:
  <<: *default
  # WebSocket URL for clients (same domain, /cable path)
  websocket_url: <%= ENV.fetch("ANYCABLE_WEBSOCKET_URL", "wss://#{ENV['APP_HOST']}/cable") %>
  # Broadcast URL - container name varies by deployment:
  # - Kamal: sabha-anycable
  # - campfire_cloud/Docker Compose: anycable
  http_broadcast_url: <%= ENV.fetch("ANYCABLE_BROADCAST_URL", "http://sabha-anycable:8080/_broadcast") %>
  secret: <%= ENV["ANYCABLE_SECRET"] %>
  # Client-facing secret for JWT identity + signed streams. Distinct from the
  # infra ANYCABLE_SECRET (RPC/broadcast) so a client-secret leak can't spoof
  # the RPC link and vice versa. Falls back to ANYCABLE_SECRET when unset, so a
  # single-secret deploy keeps working; anycable-go's --jwt_secret/--streams_secret
  # must fall back the same way (see the anycable accessory env).
  jwt_secret: <%= ENV["ANYCABLE_JWT_SECRET"].presence || ENV["ANYCABLE_SECRET"] %>
  streams_secret: <%= ENV["ANYCABLE_JWT_SECRET"].presence || ENV["ANYCABLE_SECRET"] %>
