# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
<% saas_mode = defined?(Campfire) ? Campfire.saas? : false %>

default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>
  timeout: 5000
  retries: 1000
  default_transaction_mode: immediate

development:
  primary:
    <<: *default
<% if saas_mode %>
    database: "storage/workspaces/development/%{tenant}/db/main.sqlite3"
    tenanted: true
    max_connection_pools: 50
<% else %>
    database: storage/db/development.sqlite3
<% end %>
<% if saas_mode %>
  untenanted:
    <<: *default
    database: storage/untenanted/development.sqlite3
    migrations_paths: saas/db/untenanted_migrate
<% end %>
  queue:
    <<: *default
    database: storage/db/development_queue.sqlite3
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
<% if saas_mode %>
    database: "storage/workspaces/test/%{tenant}/db/main.sqlite3"
    tenanted: true
<% else %>
    database: storage/db/test.sqlite3
<% end %>
<% if saas_mode %>
  untenanted:
    <<: *default
    database: storage/untenanted/test.sqlite3
    migrations_paths: saas/db/untenanted_migrate
<% end %>
  queue:
    <<: *default
    database: storage/db/test_queue.sqlite3
    migrations_paths: db/queue_migrate

performance:
  primary:
    <<: *default
    database: storage/db/performance.sqlite3
  queue:
    <<: *default
    database: storage/db/performance_queue.sqlite3
    migrations_paths: db/queue_migrate

production:
  primary:
    <<: *default
<% if saas_mode %>
    database: "storage/workspaces/production/%{tenant}/db/main.sqlite3"
    tenanted: true
    max_connection_pools: 100
<% else %>
    database: storage/db/production.sqlite3
<% end %>
<% if saas_mode %>
  untenanted:
    <<: *default
    database: storage/untenanted/production.sqlite3
    migrations_paths: saas/db/untenanted_migrate
<% end %>
  queue:
    <<: *default
    database: storage/db/production_queue.sqlite3
    migrations_paths: db/queue_migrate
