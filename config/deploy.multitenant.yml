# Kamal deployment configuration for sabha.co (SaaS mode)
# Deploy with: kamal deploy -d multitenant
# Follow logs: set -a && source .env.multitenant && set +a && kamal logs -f -d multitenant

service: sabha

ssh:
  user: sabha

image: sabha-co/sabha

servers:
  web:
    hosts:
      - <%= ENV.fetch("SERVER_IP") %>
    options:
      network-alias: sabha-web

proxy:
  ssl: true
  host: <%= ENV.fetch("PROXY_HOST") %>
  app_port: 3000
  healthcheck:
    interval: 1
    path: /up
    timeout: 3

drain_timeout: 10

registry:
  server: ghcr.io
  username: sabha-co
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  dockerfile: saas/Dockerfile
  cache:
    type: registry
    options: mode=max,image-manifest=true,oci-mediatypes=true
    image: sabha-co/sabha-build-cache

env:
  clear:
    RAILS_ENV: "production"
    SAAS: "true"
  secret:
    - APP_VERSION
    - LAST_DEPLOY
    - SECRET_KEY_BASE
    - UNTENANTED_DATABASE_URL
    - VAPID_PUBLIC_KEY
    - VAPID_PRIVATE_KEY
    - RESEND_API_KEY
    - EMAIL_PROVIDER
    - AWS_SES_REGION
    - AWS_SES_ACCESS_KEY_ID
    - AWS_SES_SECRET_ACCESS_KEY
    - SES_CONFIGURATION_SET
    - COOKIE_DOMAIN
    - APP_NAME
    - APP_SHORT_NAME
    - APP_DESCRIPTION
    - APP_HOST
    - SUPPORT_EMAIL
    - MAILER_FROM_NAME
    - MAILER_FROM_EMAIL
    - THEME_COLOR
    - BACKGROUND_COLOR
    - UMAMI_WEBSITE_ID
    - UMAMI_HOST
    - CSP_FRAME_ANCESTORS
    - ANYCABLE_ENABLED
    - ANYCABLE_SECRET
    - CLOUDFLARE_TURNSTILE_SITE_KEY
    - CLOUDFLARE_TURNSTILE_SECRET_KEY
    - SENTRY_DSN
    - ADMIN_EMAIL
    - R2_ACCESS_KEY_ID
    - R2_SECRET_ACCESS_KEY
    - R2_ENDPOINT
    - R2_BUCKET

volumes:
  - "/disk/sabha/:/rails/storage/"

accessories:
  anycable:
    image: anycable/anycable-go:1.6
    host: <%= ENV.fetch("SERVER_IP") %>
    proxy:
      host: <%= ENV.fetch("PROXY_HOST") %>
      app_port: 8080
      path_prefix: /cable
      healthcheck:
        path: /health
    env:
      clear:
        ANYCABLE_HOST: "0.0.0.0"
        ANYCABLE_PORT: "8080"
        ANYCABLE_PATH: "/"
        ANYCABLE_RPC_HOST: "http://sabha-web:3000/_anycable"
        ANYCABLE_BROADCAST_ADAPTER: "http"
        ANYCABLE_HTTP_BROADCAST_PORT: "8080"
        ANYCABLE_LOG_LEVEL: "info"
      secret:
        - ANYCABLE_SECRET

  # Beszel monitoring agent — reports host + container metrics to the hub at
  # https://monitor.sabha.co. Same hub used for SabhaCloud customer servers.
  beszel-agent:
    image: henrygd/beszel-agent:latest
    host: <%= ENV.fetch("SERVER_IP") %>
    options:
      network: "host"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "beszel_agent_data:/var/lib/beszel-agent"
    env:
      clear:
        LISTEN: 45876
      secret:
        - HUB_URL
        - TOKEN
        - KEY

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
