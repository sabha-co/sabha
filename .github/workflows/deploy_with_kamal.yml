name: Deploy with Kamal

on:
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_setup:
        description: 'Run kamal setup before deploy (first-time provisioning)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-multitenant
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy with Kamal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Get short SHA
        id: short-sha
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true

      - name: Cache Kamal gem
        id: kamal-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/kamal-gems
          key: kamal-gem-${{ runner.os }}-ruby-4.0.1

      - name: Install Kamal
        run: |
          echo "GEM_HOME=${{ runner.tool_cache }}/kamal-gems" >> $GITHUB_ENV
          echo "${{ runner.tool_cache }}/kamal-gems/bin" >> $GITHUB_PATH
          export GEM_HOME="${{ runner.tool_cache }}/kamal-gems"
          if [ "${{ steps.kamal-cache.outputs.cache-hit }}" != "true" ]; then
            gem install kamal
          fi

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key to known hosts
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking=no" >> ~/.ssh/config
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Set deployment timestamp
        run: echo "DEPLOY_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Create Kamal secrets file
        run: |
          mkdir -p .kamal
          cat > .kamal/secrets.multitenant << EOF
          KAMAL_REGISTRY_PASSWORD=${{ secrets.DOCKER_PASSWORD }}

          SERVER_IP=${{ secrets.SERVER_IP }}
          PROXY_HOST=${{ secrets.DOMAIN }}

          APP_VERSION=${{ steps.short-sha.outputs.sha }}
          LAST_DEPLOY=${{ env.DEPLOY_TIME }}
          SECRET_KEY_BASE=${{ secrets.SECRET_KEY_BASE }}
          UNTENANTED_DATABASE_URL=${{ secrets.UNTENANTED_DATABASE_URL }}
          VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EMAIL_PROVIDER=${{ secrets.EMAIL_PROVIDER }}
          AWS_SES_REGION=${{ secrets.AWS_SES_REGION }}
          AWS_SES_ACCESS_KEY_ID=${{ secrets.AWS_SES_ACCESS_KEY_ID }}
          AWS_SES_SECRET_ACCESS_KEY=${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
          SES_CONFIGURATION_SET=${{ secrets.SES_CONFIGURATION_SET }}
          EMAIL_GLOBALLY_DISABLED=${{ secrets.EMAIL_GLOBALLY_DISABLED }}
          COOKIE_DOMAIN=${{ secrets.COOKIE_DOMAIN }}

          APP_NAME=${{ secrets.APP_NAME }}
          APP_SHORT_NAME=${{ secrets.APP_SHORT_NAME }}
          APP_DESCRIPTION=${{ secrets.APP_DESCRIPTION }}
          APP_HOST=${{ secrets.APP_HOST }}
          SUPPORT_EMAIL=${{ secrets.SUPPORT_EMAIL }}
          MAILER_FROM_NAME=${{ secrets.MAILER_FROM_NAME }}
          MAILER_FROM_EMAIL=${{ secrets.MAILER_FROM_EMAIL }}
          THEME_COLOR=${{ secrets.THEME_COLOR }}
          BACKGROUND_COLOR=${{ secrets.BACKGROUND_COLOR }}
          UMAMI_WEBSITE_ID=${{ secrets.UMAMI_WEBSITE_ID }}
          UMAMI_HOST=${{ secrets.UMAMI_HOST }}
          CSP_FRAME_ANCESTORS=${{ secrets.CSP_FRAME_ANCESTORS }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}

          ANYCABLE_ENABLED=${{ secrets.ANYCABLE_ENABLED }}
          ANYCABLE_SECRET=${{ secrets.ANYCABLE_SECRET }}

          CLOUDFLARE_TURNSTILE_SITE_KEY=${{ secrets.CLOUDFLARE_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY=${{ secrets.CLOUDFLARE_TURNSTILE_SECRET_KEY }}

          SENTRY_DSN=${{ secrets.SENTRY_DSN }}

          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
          R2_BUCKET=${{ secrets.R2_BUCKET }}

          SSO_PROVIDER_CLIENTS=${{ secrets.SSO_PROVIDER_CLIENTS }}
          SSO_CLOUD_SABHA_RETURN_HOST=${{ secrets.SSO_CLOUD_SABHA_RETURN_HOST }}
          SSO_CLOUD_SABHA_SECRET=${{ secrets.SSO_CLOUD_SABHA_SECRET }}
          SSO_MANAGED_SABHA_RETURN_HOST=${{ secrets.SSO_MANAGED_SABHA_RETURN_HOST }}
          SSO_MANAGED_SABHA_SECRET=${{ secrets.SSO_MANAGED_SABHA_SECRET }}
          EOF

      - name: Run Kamal setup (first-time provisioning)
        if: ${{ github.event.inputs.run_setup == 'true' }}
        run: kamal setup -d multitenant
        env:
          KAMAL_REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          PROXY_HOST: ${{ secrets.DOMAIN }}

      - name: Deploy with Kamal
        if: ${{ github.event.inputs.run_setup != 'true' }}
        run: kamal deploy -d multitenant
        env:
          KAMAL_REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          PROXY_HOST: ${{ secrets.DOMAIN }}

      - name: Reboot AnyCable to sync secrets
        if: ${{ github.event.inputs.run_setup != 'true' }}
        run: kamal accessory reboot anycable -d multitenant
        env:
          KAMAL_REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          PROXY_HOST: ${{ secrets.DOMAIN }}

      - name: Notify deploy channel
        if: ${{ env.DEPLOY_BOT_URL != '' }}
        env:
          DEPLOY_BOT_URL: ${{ secrets.DEPLOY_BOT_URL }}
        run: |
          curl -s -X POST "$DEPLOY_BOT_URL" \
            -d "Deployed ${{ steps.short-sha.outputs.sha }} by ${{ github.actor }} at ${{ env.DEPLOY_TIME }}"
