name: Deploy with Kamal

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_setup:
        description: 'Run kamal setup before deploy (first-time provisioning)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-multitenant
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy with Kamal
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get short SHA
        uses: benjlevesque/short-sha@599815c8ee942a9616c92bcfb4f947a3b670ab0b # v3.0
        id: short-sha
        with:
          length: 7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.1'
          bundler-cache: true

      - name: Install Kamal
        run: gem install kamal

      - name: Set up SSH key
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key to known hosts
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking=no" >> ~/.ssh/config
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Set deployment timestamp
        run: echo "DEPLOY_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Create Kamal secrets file
        run: |
          mkdir -p .kamal
          cat > .kamal/secrets.multitenant << EOF
          KAMAL_REGISTRY_PASSWORD=${{ secrets.DOCKER_PASSWORD }}

          SERVER_IP=${{ secrets.SERVER_IP }}
          PROXY_HOST=${{ secrets.DOMAIN }}

          APP_VERSION=${{ steps.short-sha.outputs.sha }}
          LAST_DEPLOY=${{ env.DEPLOY_TIME }}
          SECRET_KEY_BASE=${{ secrets.SECRET_KEY_BASE }}
          UNTENANTED_DATABASE_URL=${{ secrets.UNTENANTED_DATABASE_URL }}
          VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          COOKIE_DOMAIN=${{ secrets.COOKIE_DOMAIN }}

          APP_NAME=${{ secrets.APP_NAME }}
          APP_SHORT_NAME=${{ secrets.APP_SHORT_NAME }}
          APP_DESCRIPTION=${{ secrets.APP_DESCRIPTION }}
          APP_HOST=${{ secrets.APP_HOST }}
          SUPPORT_EMAIL=${{ secrets.SUPPORT_EMAIL }}
          MAILER_FROM_NAME=${{ secrets.MAILER_FROM_NAME }}
          MAILER_FROM_EMAIL=${{ secrets.MAILER_FROM_EMAIL }}
          SAAS_MAILER_FROM_NAME=${{ secrets.SAAS_MAILER_FROM_NAME }}
          SAAS_MAILER_FROM_EMAIL=${{ secrets.SAAS_MAILER_FROM_EMAIL }}
          THEME_COLOR=${{ secrets.THEME_COLOR }}
          BACKGROUND_COLOR=${{ secrets.BACKGROUND_COLOR }}
          ANALYTICS_DOMAIN=${{ secrets.ANALYTICS_DOMAIN }}
          CSP_FRAME_ANCESTORS=${{ secrets.CSP_FRAME_ANCESTORS }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}

          ANYCABLE_ENABLED=${{ secrets.ANYCABLE_ENABLED }}
          ANYCABLE_SECRET=${{ secrets.ANYCABLE_SECRET }}

          CLOUDFLARE_TURNSTILE_SITE_KEY=${{ secrets.CLOUDFLARE_TURNSTILE_SITE_KEY }}
          CLOUDFLARE_TURNSTILE_SECRET_KEY=${{ secrets.CLOUDFLARE_TURNSTILE_SECRET_KEY }}

          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          EOF

      - name: Run Kamal setup (first-time provisioning)
        if: ${{ github.event.inputs.run_setup == 'true' }}
        run: kamal setup -d multitenant
        env:
          KAMAL_REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          PROXY_HOST: ${{ secrets.DOMAIN }}

      - name: Deploy with Kamal
        if: ${{ github.event.inputs.run_setup != 'true' }}
        run: kamal deploy -d multitenant
        env:
          KAMAL_REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          PROXY_HOST: ${{ secrets.DOMAIN }}
