<!doctype html>
<html lang="en">
  <head>
    <title>That page has moved on</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#17171c" media="(prefers-color-scheme: dark)">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      :root {
        --bg: #ffffff; --fg: #1a1420; --muted: #6b6470; --line: #e5e3e8;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #17171c; --fg: #ececf0; --muted: #9a95a3; --line: #2c2c33; }
      }
      html { font-size: 16px; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        -webkit-font-smoothing: antialiased;
        display: grid;
        place-items: center;
        min-height: 100vh;
        line-height: 1.5;
        padding: 2rem;
      }
      main { display: grid; gap: 0.6rem; place-items: center; text-align: center; max-width: 28rem; }
      .numeral { font-size: 5rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; opacity: 0.12; }
      h1 { font-size: 1.375rem; font-weight: 700; letter-spacing: -0.02em; }
      p { color: var(--muted); font-size: 0.9375rem; }
      .button {
        margin-top: 0.85rem;
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.6rem 1.1rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--fg);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <!-- This file lives in public/404.html -->
    <main>
      <p class="numeral" aria-hidden="true">404</p>
      <h1>That page has moved on</h1>
      <p>The link may be old, or the room may have been deleted. Either way there is nothing at this address.</p>
      <a class="button" href="/">Go to the community</a>
    </main>
  </body>
</html>
